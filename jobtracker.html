<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>SkyKing Job Tracker</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #111;
    color: #eee;
    font-family: Arial, sans-serif;
    padding: 16px;
    max-width: 600px;
    margin: 0 auto;
    padding-bottom: 60px;
  }
  h1 { color: #f90; font-size: 1.3rem; letter-spacing: 2px; text-align: center; padding: 12px 0 4px; }
  .subtitle { text-align: center; color: #666; font-size: 0.8rem; margin-bottom: 16px; }

  .card {
    background: #1a1a1a;
    border: 1px solid #333;
    border-radius: 10px;
    padding: 14px;
    margin-bottom: 14px;
  }
  .card-title {
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: #f90;
    margin-bottom: 10px;
  }

  label { display: block; font-size: 0.8rem; color: #999; margin-bottom: 3px; margin-top: 10px; }
  label:first-of-type { margin-top: 0; }

  input[type=text], input[type=number], input[type=date], select, textarea {
    width: 100%;
    background: #222;
    border: 1px solid #444;
    border-radius: 6px;
    color: #eee;
    padding: 10px;
    font-size: 1rem;
  }
  textarea { min-height: 60px; resize: vertical; }
  select option { background: #222; }

  .clock-row {
    display: flex;
    gap: 10px;
  }
  .clock-btn {
    flex: 1;
    padding: 16px 8px;
    border-radius: 8px;
    border: none;
    font-size: 1rem;
    font-weight: bold;
    cursor: pointer;
  }
  #btn-in { background: #2a6; color: #fff; }
  #btn-in.active { background: #1a4; }
  #btn-out { background: #c44; color: #fff; }
  #btn-out.active { background: #933; }
  .time-display {
    text-align: center;
    font-size: 0.85rem;
    color: #888;
    margin-top: 6px;
    min-height: 1.2em;
  }

  .line-items-list { margin-bottom: 10px; }
  .line-item {
    display: flex;
    gap: 8px;
    align-items: center;
    margin-bottom: 8px;
  }
  .line-item input[type=text] { flex: 2; }
  .line-item input[type=number] { flex: 1; min-width: 80px; }
  .line-item .del-btn {
    background: none;
    border: none;
    color: #c44;
    font-size: 1.3rem;
    cursor: pointer;
    padding: 0 4px;
    line-height: 1;
  }
  .add-line-btn {
    width: 100%;
    padding: 10px;
    background: #222;
    border: 1px dashed #555;
    border-radius: 6px;
    color: #aaa;
    font-size: 0.9rem;
    cursor: pointer;
  }
  .line-total {
    text-align: right;
    font-size: 0.85rem;
    color: #f90;
    margin-top: 4px;
  }

  .paid-row {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-top: 4px;
  }
  .paid-row input[type=checkbox] {
    width: 24px; height: 24px; cursor: pointer;
  }
  .paid-row label { margin: 0; font-size: 1rem; color: #eee; }

  .save-btn {
    width: 100%;
    padding: 18px;
    background: #f90;
    color: #111;
    border: none;
    border-radius: 10px;
    font-size: 1.1rem;
    font-weight: bold;
    cursor: pointer;
    margin-bottom: 14px;
  }

  .entries-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
  }
  .dl-btn {
    padding: 8px 14px;
    background: #2a6;
    color: #fff;
    border: none;
    border-radius: 6px;
    font-size: 0.85rem;
    font-weight: bold;
    cursor: pointer;
  }
  .clear-btn {
    padding: 8px 14px;
    background: #444;
    color: #eee;
    border: none;
    border-radius: 6px;
    font-size: 0.85rem;
    cursor: pointer;
  }

  .entry-card {
    background: #111;
    border: 1px solid #2a2a2a;
    border-radius: 8px;
    padding: 10px 12px;
    margin-bottom: 8px;
    font-size: 0.85rem;
  }
  .entry-card .ec-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 4px;
  }
  .ec-customer { color: #f90; font-weight: bold; }
  .ec-date { color: #666; font-size: 0.75rem; }
  .ec-desc { color: #ccc; margin-bottom: 4px; }
  .ec-meta { color: #888; font-size: 0.78rem; }
  .ec-paid { color: #2a6; font-size: 0.75rem; font-weight: bold; }
  .ec-unpaid { color: #c44; font-size: 0.75rem; font-weight: bold; }
  .ec-del { background: none; border: none; color: #555; font-size: 1rem; cursor: pointer; }

  .modal-bg {
    display: none;
    position: fixed; top:0; left:0; right:0; bottom:0;
    background: rgba(0,0,0,0.8);
    z-index: 100;
    align-items: center;
    justify-content: center;
  }
  .modal-bg.open { display: flex; }
  .modal {
    background: #1a1a1a;
    border: 1px solid #444;
    border-radius: 12px;
    padding: 20px;
    width: 90%;
    max-width: 400px;
  }
  .modal h3 { color: #f90; margin-bottom: 12px; }
  .modal input { margin-bottom: 12px; }
  .modal-btns { display: flex; gap: 10px; }
  .modal-btns button { flex: 1; padding: 12px; border: none; border-radius: 8px; font-size: 1rem; cursor: pointer; }
  .modal-ok { background: #f90; color: #111; font-weight: bold; }
  .modal-cancel { background: #333; color: #eee; }

  .confirm-msg { text-align: center; color: #2a6; font-size: 0.9rem; margin-bottom: 8px; min-height: 1.2em; }
</style>
</head>
<body>

<h1>⚡ SKYKING JOBS</h1>
<div class="subtitle">Track time · miles · expenses</div>

<!-- JOB DETAILS -->
<div class="card">
  <div class="card-title">Job Info</div>
  <label>Customer</label>
  <select id="customer">
    <option value="">— select —</option>
    <option value="KBT">KBT</option>
    <option value="It's a Wrap">It's a Wrap</option>
    <option value="__add__">+ Add customer...</option>
  </select>
  <label>Date</label>
  <input type="date" id="job-date">
  <label>Job Description</label>
  <textarea id="job-desc" placeholder="e.g. Battery cabinet teardown, KBNT Vista"></textarea>
  <label>Location</label>
  <div style="display:flex;gap:8px;align-items:center">
    <input type="text" id="job-loc" placeholder="e.g. KBNT-TV San Diego" style="flex:1">
    <button onclick="getGPS()" id="gps-btn" style="padding:10px 12px;background:#222;border:1px solid #444;border-radius:6px;color:#f90;font-size:1rem;cursor:pointer;white-space:nowrap">📍 GPS</button>
  </div>
  <div id="gps-status" style="font-size:0.75rem;color:#666;margin-top:3px;min-height:1em"></div>
</div>

<!-- TIME -->
<div class="card">
  <div class="card-title">Time</div>
  <div class="clock-row">
    <button class="clock-btn" id="btn-in" ontouchstart="clockIn()" onclick="handleClockIn()">⏱ CLOCK IN</button>
    <button class="clock-btn" id="btn-out" ontouchstart="clockOut()" onclick="handleClockOut()">⏹ CLOCK OUT</button>
  </div>
  <div class="time-display" id="time-display">Not started</div>
  <label style="margin-top:10px">Miles Driven</label>
  <input type="number" id="miles" placeholder="0" min="0">
</div>

<!-- LINE ITEMS -->
<div class="card">
  <div class="card-title">Expenses &amp; Line Items</div>
  <div class="line-items-list" id="line-items"></div>
  <button class="add-line-btn" onclick="addLineItem()">+ Add item (material, travel, dump run...)</button>
  <div class="line-total" id="line-total"></div>
</div>

<!-- PAID -->
<div class="card">
  <div class="card-title">Payment</div>
  <div class="paid-row">
    <input type="checkbox" id="paid">
    <label for="paid">Paid</label>
  </div>
</div>

<!-- SAVE -->
<div class="confirm-msg" id="save-confirm"></div>
<button class="save-btn" onclick="saveJob()">💾 Save Job Entry</button>

<!-- LOG -->
<div class="card">
  <div class="entries-header">
    <div class="card-title" style="margin:0">Saved Entries (<span id="entry-count">0</span>)</div>
    <div style="display:flex;gap:8px">
      <button class="dl-btn" onclick="downloadCSV()">⬇ CSV</button>
      <button class="clear-btn" onclick="clearAll()">Clear</button>
    </div>
  </div>
  <div id="entries-list"><em style="color:#555">No entries yet</em></div>
</div>

<!-- Add Customer Modal -->
<div class="modal-bg" id="modal-bg">
  <div class="modal">
    <h3>Add Customer</h3>
    <input type="text" id="new-customer-input" placeholder="Customer name">
    <div class="modal-btns">
      <button class="modal-cancel" onclick="closeModal()">Cancel</button>
      <button class="modal-ok" onclick="confirmAddCustomer()">Add</button>
    </div>
  </div>
</div>

<script>
// State
let timeIn = null;
let timeOut = null;
let lineItems = [];
let entries = JSON.parse(localStorage.getItem('skyking_jobs') || '[]');
let customers = JSON.parse(localStorage.getItem('skyking_customers') || '["KBT","It\'s a Wrap"]');
let touchHandled = false;

// Init
(function init() {
  const today = new Date();
  document.getElementById('job-date').value = today.toISOString().split('T')[0];
  rebuildCustomerDropdown();
  addLineItem(); // start with one blank line item
  renderEntries();

  document.getElementById('customer').addEventListener('change', function() {
    if (this.value === '__add__') openModal();
  });
})();

// Clock
function clockIn() {
  touchHandled = true;
  doClockIn();
}
function handleClockIn() { if (touchHandled) { touchHandled = false; return; } doClockIn(); }
function doClockIn() {
  timeIn = new Date();
  timeOut = null;
  updateTimeDisplay();
  document.getElementById('btn-in').classList.add('active');
  document.getElementById('btn-out').classList.remove('active');
}

function clockOut() {
  touchHandled = true;
  doClockOut();
}
function handleClockOut() { if (touchHandled) { touchHandled = false; return; } doClockOut(); }
function doClockOut() {
  if (!timeIn) { alert('Clock in first.'); return; }
  timeOut = new Date();
  updateTimeDisplay();
  document.getElementById('btn-out').classList.add('active');
}

function updateTimeDisplay() {
  const el = document.getElementById('time-display');
  if (!timeIn) { el.textContent = 'Not started'; return; }
  const inStr = timeIn.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
  if (!timeOut) { el.textContent = 'In: ' + inStr + ' — not clocked out'; return; }
  const outStr = timeOut.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
  const mins = Math.round((timeOut - timeIn) / 60000);
  const hrs = (mins / 60).toFixed(2);
  el.textContent = inStr + ' → ' + outStr + ' (' + hrs + ' hrs)';
}

// Line items
function addLineItem() {
  const id = Date.now();
  lineItems.push({ id, desc: '', cost: '' });
  renderLineItems();
}

function renderLineItems() {
  const container = document.getElementById('line-items');
  container.innerHTML = lineItems.map((item, i) => `
    <div class="line-item" id="li-${item.id}">
      <input type="text" placeholder="Description (drill bits, travel, dump...)"
        value="${item.desc}"
        oninput="lineItems[${i}].desc=this.value">
      <input type="number" placeholder="$0.00" min="0" step="0.01"
        value="${item.cost}"
        oninput="lineItems[${i}].cost=this.value;updateTotal()">
      <button class="del-btn" onclick="removeLineItem(${i})">✕</button>
    </div>
  `).join('');
  updateTotal();
}

function removeLineItem(i) {
  lineItems.splice(i, 1);
  renderLineItems();
}

function updateTotal() {
  const total = lineItems.reduce((sum, item) => sum + (parseFloat(item.cost) || 0), 0);
  const el = document.getElementById('line-total');
  el.textContent = total > 0 ? 'Total expenses: $' + total.toFixed(2) : '';
}

// Save
function saveJob() {
  const customer = document.getElementById('customer').value;
  const date = document.getElementById('job-date').value;
  const desc = document.getElementById('job-desc').value.trim();
  const loc = document.getElementById('job-loc').value.trim();
  const miles = document.getElementById('miles').value;
  const paid = document.getElementById('paid').checked;

  if (!customer || customer === '__add__') { alert('Select a customer.'); return; }
  if (!desc) { alert('Add a job description.'); return; }

  const entry = {
    id: Date.now(),
    customer,
    date,
    desc,
    location: loc,
    timeIn: timeIn ? timeIn.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}) : '',
    timeOut: timeOut ? timeOut.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}) : '',
    hours: (timeIn && timeOut) ? ((timeOut - timeIn)/3600000).toFixed(2) : '',
    miles: miles || '',
    lineItems: lineItems.filter(l => l.desc || l.cost).map(l => ({...l})),
    totalExpenses: lineItems.reduce((s,l) => s + (parseFloat(l.cost)||0), 0).toFixed(2),
    paid
  };

  entries.unshift(entry);
  localStorage.setItem('skyking_jobs', JSON.stringify(entries));
  renderEntries();
  resetForm();

  const msg = document.getElementById('save-confirm');
  msg.textContent = '✓ Job saved!';
  setTimeout(() => msg.textContent = '', 3000);
}

function resetForm() {
  document.getElementById('customer').value = '';
  document.getElementById('job-date').value = new Date().toISOString().split('T')[0];
  document.getElementById('job-desc').value = '';
  document.getElementById('job-loc').value = '';
  document.getElementById('miles').value = '';
  document.getElementById('paid').checked = false;
  timeIn = null; timeOut = null;
  updateTimeDisplay();
  document.getElementById('btn-in').classList.remove('active');
  document.getElementById('btn-out').classList.remove('active');
  lineItems = [];
  addLineItem();
}

// Render entries
function renderEntries() {
  const el = document.getElementById('entries-list');
  document.getElementById('entry-count').textContent = entries.length;
  if (!entries.length) { el.innerHTML = '<em style="color:#555">No entries yet</em>'; return; }
  el.innerHTML = entries.map((e, i) => {
    const itemSummary = e.lineItems && e.lineItems.length
      ? e.lineItems.map(l => l.desc + (l.cost ? ' $'+parseFloat(l.cost).toFixed(2) : '')).join(', ')
      : '';
    return `<div class="entry-card">
      <div class="ec-header">
        <span class="ec-customer">${e.customer}</span>
        <span style="display:flex;align-items:center;gap:8px">
          <span class="${e.paid ? 'ec-paid' : 'ec-unpaid'}">${e.paid ? '✓ PAID' : 'UNPAID'}</span>
          <button class="ec-del" onclick="deleteEntry(${i})">✕</button>
        </span>
      </div>
      <div class="ec-date">${e.date}${e.location ? ' · ' + e.location : ''}</div>
      <div class="ec-desc">${e.desc}</div>
      <div class="ec-meta">
        ${e.timeIn ? e.timeIn + ' → ' + (e.timeOut || '?') + (e.hours ? ' (' + e.hours + ' hrs)' : '') : ''}
        ${e.miles ? ' · ' + e.miles + ' mi' : ''}
        ${parseFloat(e.totalExpenses) > 0 ? ' · $' + e.totalExpenses + ' expenses' : ''}
      </div>
      ${itemSummary ? `<div class="ec-meta" style="margin-top:3px;font-style:italic">${itemSummary}</div>` : ''}
    </div>`;
  }).join('');
}

function deleteEntry(i) {
  if (!confirm('Delete this entry?')) return;
  entries.splice(i, 1);
  localStorage.setItem('skyking_jobs', JSON.stringify(entries));
  renderEntries();
}

function clearAll() {
  if (!entries.length || confirm('Clear ALL entries?')) {
    entries = [];
    localStorage.setItem('skyking_jobs', JSON.stringify(entries));
    renderEntries();
  }
}

// CSV Download
function downloadCSV() {
  if (!entries.length) { alert('No entries to download.'); return; }
  const headers = ['date','customer','description','location','time_in','time_out','hours','miles','expenses_total','line_items','paid'];
  const rows = entries.map(e => [
    e.date, e.customer, e.desc, e.location || '',
    e.timeIn || '', e.timeOut || '', e.hours || '', e.miles || '',
    e.totalExpenses,
    e.lineItems ? e.lineItems.map(l => l.desc + (l.cost ? ':$'+l.cost : '')).join(' | ') : '',
    e.paid ? 'YES' : 'NO'
  ].map(v => `"${String(v).replace(/"/g,'""')}"`).join(','));

  const csv = [headers.join(','), ...rows].join('\n');
  const blob = new Blob([csv], {type:'text/csv'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const now = new Date();
  const stamp = now.getFullYear() + String(now.getMonth()+1).padStart(2,'0') + String(now.getDate()).padStart(2,'0');
  a.href = url; a.download = 'skyking_jobs_' + stamp + '.csv';
  a.click(); URL.revokeObjectURL(url);
}

// GPS
function getGPS() {
  const status = document.getElementById('gps-status');
  const btn = document.getElementById('gps-btn');
  if (!navigator.geolocation) { status.textContent = 'GPS not available on this device'; return; }
  status.textContent = 'Getting location...';
  btn.textContent = '⏳ GPS';
  navigator.geolocation.getCurrentPosition(
    (pos) => {
      const lat = pos.coords.latitude.toFixed(5);
      const lng = pos.coords.longitude.toFixed(5);
      fetch(`https://nominatim.openstreetmap.org/reverse?lat=${lat}&lon=${lng}&format=json`)
        .then(r => r.json())
        .then(data => {
          const addr = data.display_name || (lat + ', ' + lng);
          document.getElementById('job-loc').value = addr;
          status.textContent = '✓ Location set';
          btn.textContent = '📍 GPS';
          setTimeout(() => status.textContent = '', 3000);
        })
        .catch(() => {
          document.getElementById('job-loc').value = lat + ', ' + lng;
          status.textContent = '✓ Coordinates set (no address lookup)';
          btn.textContent = '📍 GPS';
          setTimeout(() => status.textContent = '', 3000);
        });
    },
    (err) => {
      status.textContent = 'Could not get location: ' + err.message;
      btn.textContent = '📍 GPS';
    },
    { enableHighAccuracy: true, timeout: 10000 }
  );
}

// Customer modal
function openModal() { document.getElementById('modal-bg').classList.add('open'); document.getElementById('new-customer-input').value = ''; setTimeout(() => document.getElementById('new-customer-input').focus(), 100); }
function closeModal() { document.getElementById('modal-bg').classList.remove('open'); document.getElementById('customer').value = ''; }
function confirmAddCustomer() {
  const name = document.getElementById('new-customer-input').value.trim();
  if (!name) return;
  if (!customers.includes(name)) {
    customers.push(name);
    localStorage.setItem('skyking_customers', JSON.stringify(customers));
  }
  rebuildCustomerDropdown();
  document.getElementById('customer').value = name;
  closeModal();
}
function rebuildCustomerDropdown() {
  const sel = document.getElementById('customer');
  const current = sel.value;
  sel.innerHTML = '<option value="">— select —</option>';
  customers.forEach(c => {
    const opt = document.createElement('option');
    opt.value = c; opt.textContent = c;
    sel.appendChild(opt);
  });
  const addOpt = document.createElement('option');
  addOpt.value = '__add__'; addOpt.textContent = '+ Add customer...';
  sel.appendChild(addOpt);
  if (current && current !== '__add__') sel.value = current;
}
</script>
</body>
</html>
