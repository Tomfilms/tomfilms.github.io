<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>SkyKing Intake</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #111;
    color: #eee;
    font-family: 'Arial', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px;
    gap: 16px;
  }
  h1 { font-size: 1.4rem; color: #f90; letter-spacing: 2px; margin-top: 10px; }
  #status {
    font-size: 1rem;
    color: #aaa;
    min-height: 1.4em;
    text-align: center;
  }
  #status.listening { color: #4f4; }
  #mic-btn {
    width: 180px;
    height: 180px;
    border-radius: 50%;
    border: 6px solid #f90;
    background: #222;
    color: #f90;
    font-size: 1.2rem;
    font-weight: bold;
    cursor: pointer;
    transition: background 0.15s, color 0.15s;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 8px;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }
  #mic-btn.active {
    background: #f90;
    color: #111;
    border-color: #fff;
  }
  #mic-icon { font-size: 3rem; line-height: 1; }
  #transcript-box {
    width: 100%;
    max-width: 600px;
    background: #1a1a1a;
    border: 1px solid #444;
    border-radius: 8px;
    padding: 12px;
    font-size: 1rem;
    color: #ddd;
    min-height: 80px;
    font-style: italic;
    line-height: 1.5;
  }
  #entries-area {
    width: 100%;
    max-width: 600px;
    background: #1a1a1a;
    border: 1px solid #333;
    border-radius: 8px;
    padding: 12px;
    min-height: 120px;
    max-height: 300px;
    overflow-y: auto;
    font-size: 0.9rem;
    line-height: 1.8;
    color: #ccc;
  }
  .entry-line {
    border-bottom: 1px solid #2a2a2a;
    padding: 4px 0;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .entry-line span { flex: 1; }
  .del-btn {
    background: none;
    border: none;
    color: #c44;
    font-size: 1.1rem;
    cursor: pointer;
    padding: 0 4px;
  }
  .btn-row {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    justify-content: center;
    width: 100%;
    max-width: 600px;
  }
  .action-btn {
    flex: 1;
    min-width: 120px;
    padding: 14px 10px;
    border-radius: 8px;
    border: none;
    font-size: 1rem;
    font-weight: bold;
    cursor: pointer;
  }
  #copy-btn { background: #2a6; color: #fff; }
  #copy-btn a { color: #fff; text-decoration: none; }
  #clear-btn { background: #444; color: #eee; }
  #copy-confirm { color: #4f4; font-size: 0.95rem; min-height: 1.2em; }
  .label { font-size: 0.75rem; color: #666; text-transform: uppercase; letter-spacing: 1px; align-self: flex-start; width: 100%; max-width: 600px; }
</style>
</head>
<body>

<h1>⚡ SKYKING INTAKE</h1>
<div id="status">Tap the button to start talking</div>

<button id="mic-btn" ontouchstart="toggleMic()" onclick="handleClick()">
  <span id="mic-icon">🎙️</span>
  <span id="mic-label">TAP TO TALK</span>
</button>

<div class="label">Heard:</div>
<div id="transcript-box">—</div>

<div class="label">Entries (<span id="count">0</span>):</div>
<div id="entries-area"><em style="color:#555">Nothing yet</em></div>

<div class="btn-row">
  <button class="action-btn" id="copy-btn" onclick="copyCSV()">⬇️ Download CSV</button>
  <button class="action-btn" id="clear-btn" onclick="clearAll()">🗑️ Clear All</button>
</div>
<div id="copy-confirm"></div>

<script>
let recognition = null;
let listening = false;
let entries = [];
let touchHandled = false;

function initRecognition() {
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SpeechRecognition) {
    document.getElementById('status').textContent = 'Speech not supported on this browser';
    return null;
  }
  const r = new SpeechRecognition();
  r.continuous = false;
  r.interimResults = true;
  r.lang = 'en-US';

  r.onstart = () => {
    listening = true;
    document.getElementById('mic-btn').classList.add('active');
    document.getElementById('mic-label').textContent = 'TAP TO STOP';
    document.getElementById('status').textContent = '🔴 Listening...';
    document.getElementById('status').className = 'listening';
    document.getElementById('transcript-box').textContent = '...';
  };

  r.onresult = (e) => {
    let interim = '';
    let final = '';
    for (let i = e.resultIndex; i < e.results.length; i++) {
      if (e.results[i].isFinal) {
        final += e.results[i][0].transcript;
      } else {
        interim += e.results[i][0].transcript;
      }
    }
    document.getElementById('transcript-box').textContent = final || interim || '...';
    if (final.trim()) {
      addEntry(final.trim());
      stopListening();
    }
  };

  r.onerror = (e) => {
    if (e.error === 'no-speech') {
      document.getElementById('status').textContent = 'No speech detected — tap again';
    } else {
      document.getElementById('status').textContent = 'Error: ' + e.error;
    }
    stopListening();
  };

  r.onend = () => {
    stopListening();
  };

  return r;
}

function toggleMic() {
  touchHandled = true;
  if (listening) {
    stopListening();
  } else {
    startListening();
  }
}

function handleClick() {
  if (touchHandled) { touchHandled = false; return; }
  if (listening) {
    stopListening();
  } else {
    startListening();
  }
}

function startListening() {
  recognition = initRecognition();
  if (!recognition) return;
  try { recognition.start(); } catch(e) {}
}

function stopListening() {
  listening = false;
  document.getElementById('mic-btn').classList.remove('active');
  document.getElementById('mic-label').textContent = 'TAP TO TALK';
  document.getElementById('status').textContent = 'Tap the button to start talking';
  document.getElementById('status').className = '';
  if (recognition) {
    try { recognition.stop(); } catch(e) {}
    recognition = null;
  }
}

function addEntry(text) {
  entries.push(text);
  renderEntries();
}

function deleteEntry(i) {
  entries.splice(i, 1);
  renderEntries();
}

function renderEntries() {
  const area = document.getElementById('entries-area');
  document.getElementById('count').textContent = entries.length;
  if (!entries.length) {
    area.innerHTML = '<em style="color:#555">Nothing yet</em>';
    return;
  }
  area.innerHTML = entries.map((e, i) =>
    `<div class="entry-line"><span>${i+1}. ${e}</span><button class="del-btn" ontouchstart="deleteEntry(${i})" onclick="delClick(event,${i})">✕</button></div>`
  ).join('');
  area.scrollTop = area.scrollHeight;
}

function delClick(ev, i) {
  ev.stopPropagation();
  deleteEntry(i);
}

function copyCSV() {
  if (!entries.length) { alert('Nothing to download yet.'); return; }
  const header = 'description';
  const rows = entries.map(e => `"${e.replace(/"/g,'""')}"`);
  const csv = [header, ...rows].join('\n');
  const blob = new Blob([csv], { type: 'text/csv' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const now = new Date();
  const stamp = now.getFullYear() + String(now.getMonth()+1).padStart(2,'0') + String(now.getDate()).padStart(2,'0') + '_' + String(now.getHours()).padStart(2,'0') + String(now.getMinutes()).padStart(2,'0');
  a.href = url;
  a.download = 'skyking_intake_' + stamp + '.csv';
  a.click();
  URL.revokeObjectURL(url);
  document.getElementById('copy-confirm').textContent = '✓ Downloaded!';
  setTimeout(() => document.getElementById('copy-confirm').textContent = '', 3000);
}

function clearAll() {
  if (!entries.length || confirm('Clear all entries?')) {
    entries = [];
    renderEntries();
    document.getElementById('transcript-box').textContent = '—';
    document.getElementById('copy-confirm').textContent = '';
  }
}
</script>
</body>
</html>
