function ptsOf(p){if(p.type==='Safety')return 2;if(p.td)return 6+(p.pat==null?1:p.pat);if(p.type==='FG')return 3;return 0}
function scoreCalc(){
  var list=S.plays.filter(function(p){return !p.pending}).sort(byTs),h=0,a=0,map={};
  for(var i=0;i<list.length;i++){var p=list[i],pts=ptsOf(p);
    if(pts){if(p.side==='home')h+=pts;else a+=pts;if(p.fix){h=p.fix.h;a=p.fix.a}map[p.id]={h:h,a:a}}}
  return {h:h,a:a,map:map};
}
function scoreText(s){
  var H=(S.game.home||'').toUpperCase(),A=(S.game.away||'').toUpperCase();
  if(s.h>s.a)return s.h+'-'+s.a+' '+H;
  if(s.a>s.h)return s.a+'-'+s.h+' '+A;
  return s.h+'-'+s.a;
}

/* ---------- time / clips ---------- */
function clipTag(ts){
  if(!S.clips||!S.clips.length)return '';
  var cs=secOfDay(ts,S.game.offset),best=null;
  for(var i=0;i<S.clips.length;i++){var c=S.clips[i];if(c.sec<=cs&&(!best||c.sec>best.sec))best=c}
  if(!best)return '';
  var d=cs-best.sec;
  return best.name+' +'+Math.floor(d/60)+':'+p2(d%60);
}

/* ---------- PPR shot sheet generation ---------- */
function ref(name,num,phon,seen){
  if(!name)return num?'#'+num:'';
  var k=name.toLowerCase();
  if(seen[k]){var t=name.split(/\s+/);return t[t.length-1]}
  seen[k]=1;
  return phon?'\u0001'+phon+'\u0002':name;
}
function describe(p,seen){
  var t=p.type,y=p.yds,a=y==null?null:Math.abs(y),td=p.td;
  var me=ref(nameOf(p),p.num,phonOf(p),seen);
  var qr=p.qb&&(p.qb.name||p.qb.num)?ref(p.qb.name,p.qb.num,qbPhon(p.qb),seen):'';
  var T=p.team+"'s ",N=a!=null?a+'-yd ':'',s;
  if(t==='Rush'){
    s=td?me+' '+N+'TD run':(y!=null&&y<0?me+' stopped for a '+a+'-yd loss':me+' '+(a!=null?N+'run':'run'));
  }else if(t==='Pass'){
    s=qr?qr+' '+N+(td?'TD ':'')+'pass to '+me:me+' '+N+(td?'TD ':'')+'catch';
  }else if(t==='Sack'){
    s=T+me+' sacks '+(qr||'the quarterback')+(a!=null?' for a '+a+'-yd loss':'');
  }else if(t==='INT'){
    s=T+me+' intercepts '+(qr?'a pass thrown by '+qr:'the ball')+(y!=null&&y>0?' and returns it '+a+' yds':'')+(td?' for a touchdown':'');
  }else if(t==='Fumble'){
    s=T+me+' recovers the fumble'+(y!=null&&y>0?' and returns it '+a+' yds':'')+(td?' for a touchdown':'');
  }else if(t==='Punt'){
    s=me+' '+N+'punt';
  }else if(t==='KO Ret'){
    s=me+' '+N+(td?'TD ':'')+'kickoff return';
  }else if(t==='Punt Ret'){
    s=me+' '+N+(td?'TD ':'')+'punt return';
  }else if(t==='FG'){
    s=me+' '+N+'field goal';
  }else if(t==='Tackle'){
    s=T+me+' tackle'+(y!=null&&y<0?' for a '+a+'-yd loss':'');
  }else if(t==='Safety'){
    s=T+me+' safety';
  }else{
    s=p.note?(me?me+': ':'')+p.note:me;
  }
  s=s.replace(/\s+/g,' ').replace(/^\s+|\s+$/g,'');
  /* phonetics keep their own case (KY-po GUTIERREZ); everything else is caps */
  return s.split(/(\u0001.*?\u0002)/).map(function(x){return x.charAt(0)==='\u0001'?x:x.toUpperCase()}).join('');
}
function plainD(s){return s.replace(/[\u0001\u0002]/g,'')}
function genShots(){
  var sc=scoreCalc(),seen={};
  var arr=S.plays.filter(function(p){return p.star&&!p.pending}).sort(byTs);
  return arr.map(function(p,i){
    var clip=clipTag(p.ts);
    var poss=S.game[DEFTYPES[p.type]?other(p.side):p.side];
    var s=sc.map[p.id];
    return {n:i+1,p:p,
      head:'SHOT '+(i+1)+' | '+(p.q==='OT'?'OT':'Q'+p.q)+(p.num?' | #'+p.num:'')+' | CAM '+tod(p.ts,S.game.offset)+(clip?' | '+clip:''),
      qtr:p.q,poss:String(poss||'').toUpperCase()+(p.type==='Punt'?' PUNTING':''),descM:describe(p,seen),score:s?scoreText(s):'',
      note:(p.type==='Other'?'':p.note),cam:tod(p.ts,S.game.offset),clip:clip};
  }).map(function(o){o.desc=plainD(o.descM);return o});
}
function scriptText(){
  var shots=genShots(),g=S.game,st=S.station,fs=scoreCalc(),T='\t';
  var A=g.away.toUpperCase()+(st.awayRec?' ('+st.awayRec+')':''),H=g.home.toUpperCase()+(st.homeRec?' ('+st.homeRec+')':'');
  var L=[];
  L.push('Script #:'+T+st.scriptNo+T+'Away:'+T+A+T+'@'+T+'Home:'+T+H);
  L.push('MARK IF DONE');
  L.push('X');
  var est=trim(st.establisher).split(/\r?\n/);
  L.push('Establisher:'+T+(est[0]||'').toUpperCase());
  for(var i=1;i<est.length;i++)if(trim(est[i]))L.push(est[i].toUpperCase());
  L.push('QTR'+T+'POSS'+T+'DESCRIPTION OF PLAY'+T+'SCORE');
  for(var j=0;j<shots.length;j++){var s=shots[j];L.push(s.qtr+T+s.poss+T+s.desc+T+s.score)}
  L.push(scoreText(fs));
  L.push('FINAL SCORE:');
  L.push('STATISTIC OF THE GAME:'+T+(st.statistic||'').toUpperCase());
  L.push('Producer:'+T+st.producer+T+'Photographer:'+T+st.photog);
  return L.join('\n');
}
function camText(){
  var shots=genShots(),L=['CAM TIME\tCLIP\tQTR\tDESCRIPTION\tSCORE'];
  for(var i=0;i<shots.length;i++){var s=shots[i];L.push(s.cam+'\t'+s.clip+'\t'+s.qtr+'\t'+s.desc+'\t'+s.score+(s.note?'\tNOTE: '+s.note:''))}
  return L.join('\n');
}
function csvText(){
  var cols=['game_date','home','away','team','quarter','cam_time','clip','phone_time','jersey','name','phonetic','grade','play_type','yards','td','pat','highlight','marked_only','qb','note'];
  function q(v){v=v==null?'':String(v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}
  var rows=[cols.join(',')],list=S.plays.slice().sort(byTs);
  for(var i=0;i<list.length;i++){var p=list[i];

document.addEventListener('click',function(ev){
  var t=ev.target;
  while(t&&t!==document){if(t.getAttribute&&t.getAttribute('data-act'))break;t=t.parentNode}
  if(!t||t===document)return;
  var act=t.getAttribute('data-act'),v=t.getAttribute('data-v'),id=t.getAttribute('data-id');
  if(act==='tab'){grab();ui.tab=v;render();window.scrollTo(0,0)}

  else if(act==='pend'){
    if(ui.editId!==id&&dirty()&&!confirm('Discard what is in the form?'))return;
    editPlay(id);
  }
  else if(act==='pick'){
    var g=t.getAttribute('data-g');
    if(g==='star'){ui.autoStar=false;setStar(!ui.draft.star)}
    else if(g==='td')cycleTd();
    else if(g==='mqb'){ui.modal.qb=!ui.modal.qb;t.classList.toggle('on',ui.modal.qb)}
    else if(g==='mgrade'){setGroup('mgrade',ui.modal.grade===v?'':v,ui.modal)}
    else if(g==='rside'){ui.rside=v;render()}
    else{
      setGroup(g,v,ui.draft);
      if(!ui.editId&&(g==='side'||g==='q'||g==='type')){S.cur=S.cur||{};S.cur[g]=v;save()}
      if(g==='side')autofill();
      if(g==='type'){
        if(v==='FG'||v==='Safety'){if(!ui.draft.star)setStar(true);ui.autoStar=true}
        else if(ui.autoStar&&!ui.draft.td){setStar(false);ui.autoStar=false}
      }
    }
  }
  else if(act==='neg'){var f=$('f_yds'),s=f.value;f.value=s.charAt(0)==='-'?s.slice(1):'-'+s}
  else if(act==='voice')voice();
  else if(act==='save')savePlay();
  else if(act==='clear'||act==='cancel'){ui.editId=null;ui.auto=false;ui.draft=newDraft();render(true)}
  else if(act==='tstar'){for(var i=0;i<S.plays.length;i++)if(S.plays[i].id===id)S.plays[i].star=!S.plays[i].star;save();render()}
  else if(act==='edit')editPlay(id);
  else if(act==='fixscore')fixScore(id);
  else if(act==='del'){if(confirm('Delete this play?')){S.plays=S.plays.filter(function(p){return p.id!==id});if(ui.editId===id){ui.editId=null;ui.draft=newDraft()}save();render(true)}}
  else if(act==='onlyStar'){ui.onlyStar=!ui.onlyStar;render()}
  else if(act==='onlyScore'){ui.onlyScore=!ui.onlyScore;render()}
  else if(act==='qb'){grab();openModal(t.getAttribute('data-side'),'',true)}
  else if(act==='padd')openModal(ui.rside,'',false);
  else if(act==='rpaste')pasteRoster();
  else if(act==='pedit')openModal(ui.rside,t.getAttribute('data-num'),false);
  else if(act==='msave')saveModal();
  else if(act==='mcancel'){ui.modal=null;render()}
  else if(act==='mdel')delModal();
  else if(act==='readopen'){ui.read=true;ui.readIdx=0;render()}
  else if(act==='rclose'){ui.read=false;render()}
  else if(act==='rnext'){ui.readIdx++;render()}
  else if(act==='rprev'){ui.readIdx=Math.max(0,ui.readIdx-1);render()}
  else if(act==='rfont'){ui.font=Math.max(24,Math.min(160,ui.font+parseInt(t.getAttribute('data-d'),10)));render()}
  else if(act==='copyscript')copyText(scriptText());
  else if(act==='copycam')copyText(camText());
  else if(act==='dlscript')download(fname('txt'),scriptText());
  else if(act==='copymiss')copyMissing();
